[project]
name = "endfield-resource-service"
version = "0.1.0"
description = "Reproducible Endfield resource downloader and exporter"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
endfield-resource = "zmd_resource_service.cli:main"
zmd-resource = "zmd_resource_service.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
include = ["zmd_resource_service*"]
exclude = ["vendor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
